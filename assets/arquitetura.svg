<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E5C50"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAF8"/>
      <stop offset="1" stop-color="#EDF3EF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="url(#bg)"/>

  <text x="600" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1F332B">Arquitetura — Atendimento Inteligente via WhatsApp para Clínicas</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#5C6F66">n8n + IA (LLM) + WhatsApp Cloud API (Meta) + Camada de Guardrails</text>

  <!-- Paciente -->
  <rect x="60" y="130" width="200" height="80" rx="14" fill="#25D366" opacity="0.15" stroke="#25D366" stroke-width="2"/>
  <text x="160" y="163" text-anchor="middle" font-size="16" font-weight="700" fill="#1F332B">Paciente</text>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#3E5C50">Envia mensagem no WhatsApp</text>

  <!-- Meta Cloud API -->
  <rect x="330" y="130" width="220" height="80" rx="14" fill="#0866FF" opacity="0.12" stroke="#0866FF" stroke-width="2"/>
  <text x="440" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1F332B">WhatsApp Cloud API</text>
  <text x="440" y="178" text-anchor="middle" font-size="12" fill="#3E5C50">Meta Business Platform</text>
  <text x="440" y="196" text-anchor="middle" font-size="11" fill="#5C6F66">Número oficial verificado</text>

  <!-- n8n Webhook -->
  <rect x="620" y="130" width="220" height="80" rx="14" fill="#FF6D5A" opacity="0.14" stroke="#EA4B38" stroke-width="2"/>
  <text x="730" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1F332B">n8n — Webhook</text>
  <text x="730" y="178" text-anchor="middle" font-size="12" fill="#3E5C50">Recebe e normaliza o evento</text>
  <text x="730" y="196" text-anchor="middle" font-size="11" fill="#5C6F66">Orquestrador central do fluxo</text>

  <!-- Guardrails -->
  <rect x="910" y="130" width="230" height="80" rx="14" fill="#B8860B" opacity="0.13" stroke="#B8860B" stroke-width="2"/>
  <text x="1025" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1F332B">Camada de Guardrails</text>
  <text x="1025" y="178" text-anchor="middle" font-size="12" fill="#3E5C50">Regras do que pode/não pode dizer</text>
  <text x="1025" y="196" text-anchor="middle" font-size="11" fill="#5C6F66">Filtro antes e depois da IA</text>

  <!-- Arrows row 1 -->
  <line x1="260" y1="170" x2="325" y2="170" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="170" x2="615" y2="170" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="170" x2="905" y2="170" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- down to Agent -->
  <line x1="1025" y1="210" x2="1025" y2="260" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1025" y1="260" x2="730" y2="260" stroke="#3E5C50" stroke-width="2"/>

  <!-- Agente IA -->
  <rect x="600" y="260" width="260" height="90" rx="14" fill="#6E4BE0" opacity="0.13" stroke="#6E4BE0" stroke-width="2"/>
  <text x="730" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#1F332B">Agente de IA (LLM)</text>
  <text x="730" y="310" text-anchor="middle" font-size="12" fill="#3E5C50">Persona + prompt de sistema fixo</text>
  <text x="730" y="328" text-anchor="middle" font-size="11" fill="#5C6F66">Segue critérios rígidos de conduta</text>

  <line x1="730" y1="350" x2="730" y2="400" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decisao -->
  <polygon points="730,400 850,455 730,510 610,455" fill="#2C7A5B" opacity="0.14" stroke="#2C7A5B" stroke-width="2"/>
  <text x="730" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#1F332B">Classificação</text>
  <text x="730" y="468" text-anchor="middle" font-size="12" fill="#3E5C50">da intenção</text>

  <!-- Three branches -->
  <line x1="610" y1="455" x2="260" y2="455" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="510" x2="730" y2="560" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="455" x2="1080" y2="455" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FAQ box -->
  <rect x="60" y="415" width="200" height="80" rx="14" fill="#2C7A5B" opacity="0.10" stroke="#2C7A5B" stroke-width="2"/>
  <text x="160" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#1F332B">Perguntas frequentes</text>
  <text x="160" y="465" text-anchor="middle" font-size="11" fill="#3E5C50">Horários, endereço, convênios,</text>
  <text x="160" y="480" text-anchor="middle" font-size="11" fill="#3E5C50">valores, preparo de exames</text>

  <!-- Agendamento box -->
  <rect x="630" y="560" width="200" height="90" rx="14" fill="#2C7A5B" opacity="0.10" stroke="#2C7A5B" stroke-width="2"/>
  <text x="730" y="590" text-anchor="middle" font-size="14" font-weight="700" fill="#1F332B">Agendamento</text>
  <text x="730" y="610" text-anchor="middle" font-size="11" fill="#3E5C50">Consulta agenda (Google Calendar)</text>
  <text x="730" y="626" text-anchor="middle" font-size="11" fill="#3E5C50">e confirma horário</text>

  <!-- Escalonamento box -->
  <rect x="980" y="415" width="200" height="80" rx="14" fill="#C0392B" opacity="0.10" stroke="#C0392B" stroke-width="2"/>
  <text x="1080" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#1F332B">Escalonamento humano</text>
  <text x="1080" y="465" text-anchor="middle" font-size="11" fill="#3E5C50">Sintomas, urgências, dúvidas</text>
  <text x="1080" y="480" text-anchor="middle" font-size="11" fill="#3E5C50">clínicas ou reclamações</text>

  <!-- CRM/Sheets -->
  <line x1="730" y1="650" x2="730" y2="700" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="700" width="260" height="70" rx="14" fill="#3E5C50" opacity="0.10" stroke="#3E5C50" stroke-width="2"/>
  <text x="730" y="728" text-anchor="middle" font-size="13" font-weight="700" fill="#1F332B">CRM / Planilha / Banco de dados</text>
  <text x="730" y="746" text-anchor="middle" font-size="11" fill="#3E5C50">Log de conversas para auditoria (LGPD)</text>

  <!-- Resposta final -->
  <line x1="160" y1="495" x2="160" y2="560" stroke="#3E5C50" stroke-width="2"/>
  <line x1="160" y1="560" x2="160" y2="700" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080" y1="495" x2="1080" y2="700" stroke="#3E5C50" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="700" width="200" height="70" rx="14" fill="#25D366" opacity="0.15" stroke="#25D366" stroke-width="2"/>
  <text x="160" y="730" text-anchor="middle" font-size="13" font-weight="700" fill="#1F332B">Resposta ao paciente</text>
  <text x="160" y="748" text-anchor="middle" font-size="11" fill="#3E5C50">via WhatsApp, dentro da política Meta</text>

  <rect x="980" y="700" width="200" height="70" rx="14" fill="#C0392B" opacity="0.12" stroke="#C0392B" stroke-width="2"/>
  <text x="1080" y="728" text-anchor="middle" font-size="13" font-weight="700" fill="#1F332B">Equipe da clínica</text>
  <text x="1080" y="748" text-anchor="middle" font-size="11" fill="#3E5C50">Atendente humano assume a conversa</text>

  <text x="600" y="800" text-anchor="middle" font-size="11" fill="#8A9990">Todas as camadas registram logs e respeitam a janela de 24h e as políticas de mensagens da Meta.</text>
</svg>
